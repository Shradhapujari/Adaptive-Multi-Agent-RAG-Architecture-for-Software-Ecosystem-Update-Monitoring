[theme]
primaryColor = "#0E9AA7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#0D1B2A"
font = "sans serif"

# 16px is Streamlit's default root size. Everything in the app is sized in
# rem against it -- text, control heights, padding -- so raising it here
# scales the whole layout proportionally, which a font-size CSS override
# would not: that enlarges the type and leaves the chrome around it at the
# old size. One number, tune it rather than adding per-element CSS.
baseFontSize = 18
